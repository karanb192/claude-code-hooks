name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    name: Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install formatters exercised by the format-code tests
        run: |
          npm install -g prettier
          pipx install ruff
          pipx install uv
      - name: Run test suite
        run: npm test

  windows-secrets:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    name: Windows secrets Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify secret guards and installed hook commands
        run: node --test plugins/protect-secrets/tests/protect-secrets.test.js tests/protect-secrets-dispatch.test.js
